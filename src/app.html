<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
		/>
		<meta name="text-scale" content="scale" />

		<!-- PWA Metadata & Mobile App Tags -->
		<title>BREACH Household Intelligence</title>
		<meta
			name="description"
			content="BREACH - Smart Household Management, Expense Tracking & Asset Cataloging Platform"
		/>
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<meta name="theme-color" content="#cb6423" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="BREACH" />
		<meta name="application-name" content="BREACH" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[var(--color-dark-bg,#1f1f22)] text-white">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
